<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #f5f5f5;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      color: #ff8c00;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: opacity 0.2s ease;
    }
    button:hover {
      opacity: 0.9;
    }
    #start {
      background-color: #ff8c00;
      color: #121212;
    }
    #stop {
      background-color: #2c2c2c;
      color: #ff8c00;
      border: 1px solid #ff8c00;
    }
    #status {
      margin-top: 12px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
      background-color: #1e1e1e;
      padding: 6px;
      border-radius: 4px;
    }
    .footer {
      margin-top: 12px;
      font-size: 9px;
      color: #777777;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>GGWP Auto-Assign</h3>
  <div class="button-container">
    <button id="start">Start Automation</button>
    <button id="stop">Stop Automation</button>
  </div>
  <div id="status">Status: Idle</div>
  <div class="footer">Created by b.teo@playersupport.com</div>
  <script src="popup.js"></script>
</body>
</html>
